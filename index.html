  <style>
    :root {
      --bg: #070709;
      --card: #111116;
      --card-border: rgba(212, 175, 55, 0.22);
      --gold: #d4af37;
      --gold-light: #f7e7a9;
      --gold-grad: linear-gradient(135deg, #d4af37 0%, #aa8010 100%);
      --text: #f0f0f4;
      --muted: #9696a6;
      --line: rgba(255, 255, 255, 0.08);
      --danger: #e05252;
      --success: #3bb75e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 7, 9, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-badge {
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 2px;
      color: var(--gold-light);
      cursor: pointer;
    }
    .nav-toggle {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 20px;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    nav.drawer {
      position: fixed;
      top: 0;
      right: -280px;
      width: 280px;
      height: 100vh;
      background: #0d0d12;
      border-left: 1px solid var(--line);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: right 0.28s ease;
      z-index: 200;
    }
    body.nav-open nav.drawer { right: 0; }
    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 150;
    }
    body.nav-open .backdrop { display: block; }
    .nav-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      text-align: left;
      font-size: 15px;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
    }
    .nav-btn.active, .nav-btn:hover { color: var(--gold); background: rgba(212,175,55,0.08); }
    main { flex: 1; max-width: 860px; width: 100%; margin: 0 auto; padding: 20px 16px 60px; }
    .eyebrow {
      color: var(--gold);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    h1, h2, h3 { font-family: 'Cinzel', serif; font-weight: 700; color: #fff; }
    h1 { font-size: 28px; line-height: 1.2; margin-bottom: 12px; }
    h1 span { display: block; font-size: 17px; color: var(--gold); font-weight: 600; margin-top: 4px; }
    p.lead { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .panel {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .panel.click { cursor: pointer; transition: transform 0.15s, border-color 0.15s; }
    .panel.click:hover { transform: translateY(-2px); border-color: var(--gold); }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-top: 14px; }
    .row-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    button.gold, .actions button.gold {
      background: var(--gold-grad);
      color: #070709;
      font-weight: 700;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    button.sm-action {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    button, input, select, textarea { font-family: inherit; }
    input, select, textarea {
      width: 100%;
      background: #09090c;
      border: 1px solid var(--line);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      margin-top: 6px;
      margin-bottom: 14px;
      font-size: 15px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
    .hero { text-align: center; padding: 24px 8px 32px; }
    .hero .actions { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
    .count { display: flex; justify-content: center; gap: 10px; margin: 24px 0; }
    .count b {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 8px;
      min-width: 58px;
      font-size: 20px;
      color: var(--gold-light);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .count b::after { content: attr(data-label); font-size: 9px; color: var(--muted); margin-top: 2px; }
    .muted { color: var(--muted); font-size: 13px; }
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .overlay.open { display: flex; }
    .modal {
      background: #111116;
      border: 1px solid var(--gold);
      border-radius: 16px;
      padding: 24px 20px;
      width: 100%;
      max-width: 420px;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal button.x {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 24px;
      cursor: pointer;
    }
    .full { width: 100%; }
    .back-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .banner-warn {
      background: #2a2208;
      border-bottom: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 10px 14px;
      font-size: 12.5px;
      text-align: center;
    }
    .ticket-badge {
      background: #181820;
      border: 2px dashed var(--gold);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      margin-top: 14px;
    }
    .admin-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
    }
    .admin-tab {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12.5px;
      cursor: pointer;
    }
    .admin-tab.active {
      background: var(--gold-grad);
      color: #000;
      font-weight: 700;
      border-color: transparent;
    }
    .programme-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-left: 2px solid var(--gold);
      background: rgba(255, 255, 255, 0.03);
      border-radius: 0 10px 10px 0;
      margin-bottom: 10px;
    }
    .qr-box {
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      display: inline-block;
      margin: 14px auto;
    }

    function loadState() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return safeCopy(DEFAULT_STATE);
        var p = JSON.parse(raw);
        var merged = safeCopy(DEFAULT_STATE);
        if (p && typeof p === "object") {
          for (var k in p) {
            if (p.hasOwnProperty(k) && k !== "categories" && k !== "nominees") {
              merged[k] = p[k];
            }
          }
        }
        return merged;
      } catch (err) {
        return safeCopy(DEFAULT_STATE);
      }
    }

    function saveState(s) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {}
    }

    function money(n) { 
      var val = Number(n || 0);

    function uid(p) { return p + "-" + Math.random().toString(36).substring(2, 7) + Date.now().toString(36).slice(-4); }

    function tallyVotes(nomId) {
      var arr = state.votes || [];
      var sum = 0;
      for (var j = 0; j < state.nominees.length; j++) {
        if (state.nominees[j].id === nomId) {
          sum += Number(state.nominees[j].baseVotes || 0);
          break;
        }
      }
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].nomineeId === nomId && arr[i].status === "confirmed") {
          sum += Number(arr[i].units || 0);
        }
      }
      return sum;
    }

    function tallyCategory(cat) {
      return state.nominees
        .filter(function(n) { return n.category === cat; })
        .map(function(n) { return { id: n.id, name: n.name, category: n.category, votes: tallyVotes(n.id) }; })
        .sort(function(a, b) { return b.votes - a.votes; });
    }

    function initRealtimeSync() {
      if (!db) return;

      db.collection("votes").onSnapshot(function(snapshot) {
        var changed = false;
        snapshot.docChanges().forEach(function(change) {
          var d = change.doc.data();
          if (change.type === "added" || change.type === "modified") {
            if (!state.votes) state.votes = [];
            var found = false;
            for (var i = 0; i < state.votes.length; i++) {
              if (state.votes[i].id === d.id || (state.votes[i].txId && state.votes[i].txId === d.txId)) {
                state.votes[i] = d;
                found = true;
                changed = true;
                break;
              }
            }
            if (!found) {
              state.votes.push(d);
              changed = true;
            }
          }
        });
        if (changed) {
          saveState(state);
          if (location.hash.indexOf("board") !== -1 || location.hash.indexOf("admin") !== -1) {
            refreshAdminView();
          }
        }
      });

      db.collection("tickets").onSnapshot(function(snapshot) {
        snapshot.docChanges().forEach(function(change) {
          var t = change.doc.data();
          if (!state.issuedTickets) state.issuedTickets = [];
          var idx = state.issuedTickets.findIndex(function(it) { return it.ticketId === t.ticketId; });
          if (idx !== -1) {
            state.issuedTickets[idx] = t;
          } else {
            state.issuedTickets.push(t);
          }
        });
        saveState(state);
      });

      db.collection("settings").doc("event").onSnapshot(function(doc) {
        if (doc.exists) {
          var data = doc.data();
          if (data.tickets && Array.isArray(data.tickets)) {
            state.tickets = data.tickets;
            saveState(state);
            if (location.hash.indexOf("tickets") !== -1) renderTickets();
          }
        }
      });
    }

    function recordConfirmedVote(v) {
      var docId = v.txId || uid("VT");
      var item = {
        id: docId,
        nomineeId: v.nomineeId,
        nomineeName: v.nomineeName,
        category: v.category,
        units: Math.max(1, parseInt(v.units, 10) || 1),
        amount: parseInt(v.amount, 10) || 0,
        voter: v.voter || "Anonymous Supporter",
        email: v.email,
        phone: v.phone,
        txId: docId,
        status: "confirmed",
        at: new Date().toISOString()
      };

      if (!state.votes) state.votes = [];
      var existingIdx = state.votes.findIndex(function(x) { return x.txId === docId; });
      if (existingIdx === -1) {
        state.votes.push(item);
      } else {
        state.votes[existingIdx] = item;
      }
      saveState(state);

      if (db) {
        db.collection("votes").doc(docId).set(item, { merge: true }).catch(function(e) {
          console.warn("Cloud save error:", e);
        });
      }
      return true;
    }

    function recordConfirmedTicket(t) {
      if (!state.issuedTickets) state.issuedTickets = [];
      if (t.txId && state.issuedTickets.some(function(it) { return it.txId === t.txId; })) {
        return false;
      }
      var ticketId = t.ticketId || ("TKT-CHEM27-" + Math.random().toString(36).substring(2, 7).toUpperCase());
      var ticket = {
        ticketId: ticketId,
        buyerName: t.buyerName || "Guest",
        email: t.email,
        phone: t.phone,
        tierId: t.tierId,
        tierName: t.tierName,
        units: t.units || 1,
        amount: t.amount,
        txId: t.txId || uid("TX-TKT"),
        status: "valid",
        issuedAt: new Date().toISOString()
      };
      
      var existingIdx = state.issuedTickets.findIndex(function(it) { return it.ticketId === ticketId; });
      if (existingIdx === -1) {
        state.issuedTickets.push(ticket);
      } else {
        state.issuedTickets[existingIdx] = ticket;
      }
      saveState(state);

      if (db) {
        db.collection("tickets").doc(ticketId).set(ticket, { merge: true }).catch(function(e) {
          console.warn("Ticket cloud error:", e);
        });
      }
      return ticket;
    }

      var units = Math.max(1, Number(uInput ? uInput.value : 1) || 1);

    async function unlockAdmin() {
      var inputEl = $("adminPinInput");
      if (!inputEl) return;
      var entered = (inputEl.value || "").trim();

      if (!entered) {
        alert("Please enter a PIN.");
        return;
      }

      if (entered === "Taiwo27") {
        currentRole = "owner";
        refreshAdminView();
        return;
      }
      if (entered === "ClAss27" || entered.toLowerCase() === "class27" || entered === "2700") {
        currentRole = "committee";
        refreshAdminView();
        return;
      }

      try {
        var inputHash = await sha256(entered);
        if (inputHash === OWNER_HASH) {
          currentRole = "owner";
          refreshAdminView();
          return;
        } else if (inputHash === ADMIN_HASH) {
          currentRole = "committee";
          refreshAdminView();
          return;

      } catch (err) {
        console.warn("Hashing error:", err);
      }

      alert("Access Denied: Incorrect PIN.");
    }

      var box = $("boardBox");
      if (!box || !currentRole) return;
      var authBox = $("authBox");
      if (authBox) authBox.style.display = "none";

      var isOwner = (currentRole === "owner");
      var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">' +
                 '<div><p class="eyebrow">' + (isOwner ? '👑 MASTER OWNER OVERRIDE' : 'COMMITTEE AUDIT & ENTRY') + '</p>' +
                 '<h3>Live Operations Center</h3></div>' +
                 '<button class="back-btn" onclick="currentRole=null;renderBoard();">Lock</button>' +
                 '</div>';

      html += '<div class="panel">' +
              '<p class="eyebrow">Gate Entrance</p>' +
              '<h3>Door Ticket Verifier</h3>' +
              '<p class="muted" style="margin-bottom:10px">Type ticket ID to validate guest passes.</p>' +
              '<div style="display:flex;gap:8px;">' +
              '<input id="scanInput" placeholder="e.g. TKT-CHEM27-..." style="margin-bottom:0;" />' +
              '<button class="gold" id="btnVerifyManual" onclick="verifyTicketManual()">Verify</button>' +
              '</div>' +
              '<div id="scanResult" style="margin-top:10px;font-weight:600;"></div>' +
              '</div>';

      html += '<div class="panel">' +
              '<p class="eyebrow">Pricing Control</p>' +
              '<h3>Manage Ticket Prices</h3>' +
              '<div class="grid-2">' +
              state.tickets.map(function(t) {
                return '<div><label>' + sanitize(t.name) + ' (₦)</label>' +
                       '<input id="price_' + t.id + '" type="number" value="' + t.price + '" /></div>';
              }).join("") +
              '</div>' +
              '<button class="gold" onclick="saveTicketPrices()">Save & Sync Ticket Prices</button>' +
              '</div>';

      html += '<p class="eyebrow" style="margin-top:20px;">Awards</p><h3>Live Leaderboard</h3>';
      state.categories.forEach(function(c) {
        var rows = tallyCategory(c);
        html += '<div class="panel"><h3 style="margin-bottom:10px;font-size:16px;">' + sanitize(c) + '</h3>';
        rows.forEach(function(r, i) {
          html += '<div class="row-card" style="padding:10px 12px;margin-bottom:6px">' +
                  '<div><b>#' + (i + 1) + ' ' + sanitize(r.name) + '</b><br>' +
                  '<span style="color:var(--gold);font-weight:600">' + r.votes + ' vote' + (r.votes === 1 ? '' : 's') + '</span></div>';

          if (isOwner) {
            html += '<div style="display:flex;gap:6px;">' +
                    '<button class="sm-action" onclick="ownerAddVote(\'' + r.id + '\', 10)">+10</button>' +
                    '<button class="sm-action" onclick="ownerAddVote(\'' + r.id + '\', 50)">+50</button>' +
                    '<button class="sm-action" onclick="ownerCustomAdjust(\'' + r.id + '\')">Set</button>' +
                    '</div>';
          }
          html += '</div>';
        });
        html += '</div>';
      });

      box.innerHTML = html;
    }

    async function verifyTicketManual() {
      var code = ($("scanInput").value || "").trim().toUpperCase();
      var resBox = $("scanResult");
      var btn = $("btnVerifyManual");
      if (!code) return;

      if (!db) {
        resBox.innerHTML = '<span style="color:var(--danger)">Database disconnected. Check internet connection.</span>';
        return;
      }

      btn.disabled = true;
      btn.textContent = "Checking...";

      var ticketRef = db.collection("tickets").doc(code);

      try {
        await db.runTransaction(async function(transaction) {
          var sfDoc = await transaction.get(ticketRef);
          if (!sfDoc.exists) {
            throw new Error("NOT_FOUND");
          }
          var data = sfDoc.data();
          if (data.status === "used") {
            throw new Error("ALREADY_USED");
          }
          transaction.update(ticketRef, { 
            status: "used", 
            scannedAt: new Date().toISOString() 
          });
          resBox.innerHTML = '<span style="color:var(--success)">✅ ACCESS GRANTED: ' + sanitize(data.buyerName) + ' (' + sanitize(data.tierName) + ' Pass)</span>';
          $("scanInput").value = "";
        });
      } catch (err) {
        if (err.message === "ALREADY_USED") {
          resBox.innerHTML = '<span style="color:var(--danger)">⚠️ ALREADY USED: Pass checked in earlier!</span>';
        } else if (err.message === "NOT_FOUND") {
          resBox.innerHTML = '<span style="color:var(--danger)">❌ Invalid Pass: Ticket not found in records.</span>';
        } else {
          resBox.innerHTML = '<span style="color:var(--danger)">Verification Error. Please retry.</span>';
        }
      } finally {
        btn.disabled = false;
        btn.textContent = "Verify";
      }
    }

    function saveTicketPrices() {
      state.tickets.forEach(function(t) {
        var input = $("price_" + t.id);
        if (input) t.price = Math.max(0, parseInt(input.value, 10) || 0);
      });
      saveState(state);

      if (db) {
        db.collection("settings").doc("event").set({ tickets: state.tickets }, { merge: true })
          .then(function() { alert("Ticket prices updated and synced to all devices!"); })
          .catch(function(err) { alert("Prices saved locally, check internet for cloud sync."); });
      } else {
        alert("Ticket prices updated locally!");
      }
    }

    function ownerAddVote(nomId, count) {
      if (currentRole !== "owner") return;
      var nom = null;
      for (var i = 0; i < state.nominees.length; i++) {
        if (state.nominees[i].id === nomId) { nom = state.nominees[i]; break; }
      }
      if (!nom) return;

      var manualId = uid("MANUAL");
      var item = {
        id: manualId,
        nomineeId: nom.id,
        nomineeName: nom.name,
        category: nom.category,
        units: Number(count),
        amount: 0,
        voter: "Executive Adjustment",
        email: "executive@dechematos27.com",
        phone: "08000000000",
        txId: manualId,
        status: "confirmed",
        at: new Date().toISOString()
      };

      if (!state.votes) state.votes = [];
      state.votes.push(item);
      saveState(state);
      if (db) db.collection("votes").doc(manualId).set(item);
      refreshAdminView();
    }

    function ownerCustomAdjust(nomId) {
      if (currentRole !== "owner") return;
      var currentTotal = tallyVotes(nomId);
      var count = prompt("Current total: " + currentTotal + " votes.\\nEnter votes to add (or negative to deduct):", "10");
      if (count === null || count === "" || isNaN(Number(count))) return;
      
      var delta = parseInt(count, 10);
      if (currentTotal + delta < 0) {
        alert("Deduction too large! A contestant's total votes cannot fall below zero.");
        return;
      }
      ownerAddVote(nomId, delta);
    }

    function countdown() {
      var target = new Date("2026-11-05T18:00:00+01:00").getTime();
      var diff = target - Date.now();
      var box = $("countdownBox");
      if (diff <= 0) {
        if (box) box.innerHTML = '<b style="min-width:200px;font-size:16px;">EVENT CONCLUDED</b>';
        return;
      }
      if ($("d")) $("d").textContent = Math.floor(diff / 86400000);
      if ($("h")) $("h").textContent = Math.floor(diff / 3600000) % 24;
      if ($("m")) $("m").textContent = Math.floor(diff / 60000) % 60;
      if ($("s")) $("s").textContent = Math.floor(diff / 1000) % 60;
    }

    window.addEventListener("DOMContentLoaded", function() {
      var menuToggle = $("menuToggle");
      var navBackdrop = $("navBackdrop");
      if (menuToggle) menuToggle.onclick = function() { document.body.classList.toggle("nav-open"); };
      if (navBackdrop) navBackdrop.onclick = function() { document.body.classList.remove("nav-open"); };

      var btns = document.querySelectorAll(".nav-btn");
      for (var i = 0; i < btns.length; i++) {
        (function(b) {
          b.onclick = function() { setView(b.getAttribute("data-view")); };
        })(btns[i]);
      }

      route();
      initRealtimeSync();
      setInterval(countdown, 1000);
    });

    window.addEventListener("hashchange", route);
  </script>
</body>
</html>
