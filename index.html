<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DE'CHEMATOS · Dinner and Award Night</title>
  <style>@import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Manrope:wght@400;500;600;700&display=swap");

:root {
  --bg: #08070b;
  --text: #f7f3fa;
  --muted: #aaa5b6;
  --gold: #d9a441;
  --line: #ffffff16;
  --sidebar: 260px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(circle at 80% 0, #271735 0, transparent 36%), var(--bg);
  color: var(--text);
  font-family: Manrope, sans-serif;
}
button, input, select { font: inherit; }
button {
  border: 1px solid #d9a44166;
  background: #ffffff0d;
  color: white;
  border-radius: 999px;
  padding: 11px 18px;
  cursor: pointer;
}
button.gold, .gold {
  background: linear-gradient(135deg, #edc66e, #b77a1d);
  color: #130e08;
  font-weight: 700;
  border: 0;
}
button.full { width: 100%; }
.eyebrow { color: var(--gold); letter-spacing: .18em; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.muted { color: var(--muted); }
h1, h2, h3 { font-family: "Cormorant Garamond", serif; margin: 8px 0 16px; }
h1 { font-size: clamp(48px, 8vw, 92px); line-height: .86; }
h1 span { display: block; font-size: .42em; letter-spacing: .08em; margin-top: 10px; }
h2 { font-size: clamp(32px, 5vw, 52px); }

.shell { min-height: 100%; }
.nav-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: #0009;
  z-index: 19;
}
body.nav-open .nav-backdrop { display: block; }
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  height: 100vh;
  height: 100dvh;
  width: min(82vw, 300px);
  padding: 22px 18px 32px;
  border-right: 1px solid var(--line);
  background: #0c0a12;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transform: translateX(-110%);
  transition: transform .22s ease;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
body.nav-open .sidebar { transform: none; }
.brand { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
.brand img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
.brand b { display: block; }
.brand small { color: var(--muted); }
.nav-btn {
  text-align: left;
  background: transparent;
  border: 0;
  border-radius: 12px;
  padding: 10px 12px;
  color: #c9c4d2;
}
.nav-btn.active, .nav-btn:hover { background: #ffffff10; color: white; }
.sidebar .grow { flex: 1; }
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: #08070bdd;
  backdrop-filter: blur(14px);
  z-index: 10;
}
#app { padding: 24px 20px 80px; max-width: 980px; margin: 0 auto; }
.hero { padding: 20px 0 40px; max-width: 860px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 22px 0; }
.count { display: flex; gap: 10px; margin: 28px 0 10px; }
.count b {
  min-width: 70px; text-align: center;
  padding: 14px 8px; border: 1px solid var(--line); border-radius: 14px; background: #ffffff08;
}
.count b::after { content: attr(data-label); display: block; font-size: 10px; color: var(--muted); letter-spacing: .12em; font-weight: 500; }
.grid-3, .grid-2, .gallery { display: grid; gap: 14px; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.gallery { grid-template-columns: repeat(3, 1fr); }
.gallery img { width: 100%; height: 220px; object-fit: cover; border-radius: 16px; }
.panel, .row-card, .empty {
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 22px;
  background: linear-gradient(160deg, #171522, #0d0c12);
}
.panel.click { cursor: pointer; }
.price { margin: 6px 0 12px; }
.split { display: grid; grid-template-columns: 280px 1fr; gap: 28px; }
.cat-list { display: flex; flex-direction: column; gap: 6px; max-height: 70vh; overflow: auto; }
.cat-link { text-align: left; border-radius: 12px; border-color: transparent; }
.cat-link.on { border-color: #d9a44166; background: #d9a44118; }
.stack { display: grid; gap: 10px; }
.row-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.row-card span { display: block; font-size: 13px; }
.overlay {
  display: none; position: fixed; inset: 0; background: #000c; place-items: center; padding: 20px; z-index: 30;
}
.overlay.open { display: grid; }
.modal {
  width: min(440px, 100%);
  background: #14121c;
  border: 1px solid #d9a44155;
  border-radius: 22px;
  padding: 26px;
}
.modal .x { float: right; padding: 4px 10px; }
label { display: block; margin: 12px 0 6px; color: var(--muted); font-size: 13px; }
input, select {
  width: 100%; padding: 12px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: #08070b; color: white;
}
.check { display: flex; align-items: center; gap: 8px; }
.check input { width: auto; }
.total { font: 700 28px "Cormorant Garamond"; }
.ticket-pass {
  max-width: 420px;
  margin: 10px auto;
  text-align: center;
  padding: 28px;
  border-radius: 24px;
  background: linear-gradient(180deg, #2a1d12, #14121c);
  border: 1px solid #d9a44155;
}
#qrbox { display: grid; place-items: center; background: #fff7e8; padding: 16px; border-radius: 16px; margin: 18px auto; width: 228px; }
.timeline { display: grid; gap: 10px; }
.timeline div {
  display: flex; justify-content: space-between;
  padding: 16px 18px; border-left: 2px solid var(--gold); background: #ffffff08; border-radius: 0 12px 12px 0;
}
.mini-list { margin-top: 12px; display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.page-label { color: var(--muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }

.back-btn { margin-bottom: 18px; }
.admin-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0 18px;
}
.admin-tab {
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 13px;
  border: 1px solid var(--line);
  background: #ffffff0a;
  color: #c9c4d2;
}
.admin-tab.on {
  background: linear-gradient(135deg, #edc66e, #b77a1d);
  color: #130e08;
  border: 0;
  font-weight: 700;
}
.admin-section { display: none; }
.admin-section.on { display: block; }
.admin-section .panel { margin-bottom: 14px; }
.admin-section label { display: block; margin: 10px 0 6px; font-size: 13px; color: var(--muted); }
.admin-help { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
.stack-tight { display: grid; gap: 8px; }
@media (max-width: 900px) {
  .grid-3, .grid-2, .gallery, .split { grid-template-columns: 1fr; }
}
@media print {
  .sidebar, .topbar, button { display: none !important; }
  .shell { display: block; }
}
</style>
</head>

function uid(prefix) {
  return prefix + "-" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return structuredClone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    return {
      ...structuredClone(DEFAULT_STATE),
      ...parsed,
      settings: { ...DEFAULT_STATE.settings, ...(parsed.settings || {}) }
    };
  } catch {
    return structuredClone(DEFAULT_STATE);
  }
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function money(n) {
  return "₦" + Number(n || 0).toLocaleString("en-NG");
}

function tallyVotes(state, nomineeId) {
  return state.votes
    .filter(v => v.nomineeId === nomineeId && v.status === "confirmed")
    .reduce((sum, v) => sum + Number(v.units || 0), 0);
}

function tallyCategory(state, category) {
  return state.nominees
    .filter(n => n.category === category)
    .map(n => ({ ...n, votes: tallyVotes(state, n.id) }))
    .sort((a, b) => b.votes - a.votes);
}

function flutterwaveReady() {
  return typeof FlutterwaveCheckout === "function";
}

function getFlutterwaveKey(state) {
  const key = (state.settings.flutterwavePublicKey || "").trim();
  if (key) return key;
  return (DEFAULT_STATE.settings.flutterwavePublicKey || "").trim();
}

function canUseLiveFlutterwave(state) {
  const key = getFlutterwaveKey(state);
  return key.indexOf("FLWPUBK") === 0 && flutterwaveReady();
}

function waitForFlutterwave(maxMs) {
  return new Promise(function (resolve) {
    if (flutterwaveReady()) return resolve(true);
    var start = Date.now();
    var t = setInterval(function () {
      if (flutterwaveReady()) {
        clearInterval(t);
        resolve(true);
      } else if (Date.now() - start > (maxMs || 5000)) {
        clearInterval(t);
        resolve(false);
      }
    }, 100);
  });
}

function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || "").trim());
}

function sanitizePhone(phone) {
  var p = String(phone || "").replace(/\s+/g, "");
  return p || "08000000000";
}

function flattenMeta(meta) {
  var out = {};
  if (!meta || typeof meta !== "object") return out;
  Object.keys(meta).forEach(function (k) {
    var v = meta[k];
    if (v == null) return;
    out[k] = typeof v === "string" || typeof v === "number" || typeof v === "boolean"
      ? String(v)
      : JSON.stringify(v);
  });
  return out;
}

function isFlutterwaveSuccess(payment) {
  if (!payment) return false;
  var status = String(payment.status || "").toLowerCase();
  if (status === "successful" || status === "completed" || status === "success") return true;
  if (status === "approved" || status === "settled") return true;
  var code = String(payment.charge_response_code || payment.chargeResponseCode || "");
  if (code === "00" || code === "0") return true;
  return false;
}

function savePendingIntent(intent) {
  try { sessionStorage.setItem("dechematos_pending_pay", JSON.stringify(intent)); } catch (e) {}
}

function clearPendingIntent() {
  try { sessionStorage.removeItem("dechematos_pending_pay"); } catch (e) {}
}

function recordConfirmedVote(state, vote) {
  if (!vote || !vote.nomineeId) return false;
  if (!state.votes) state.votes = [];
  var txId = String(vote.txId || "").trim();
  if (txId && state.votes.some(function (v) {
    return v.txId === txId && v.status === "confirmed";
  })) return false;

  state.votes.push({
    id: vote.id || uid("VT"),
    nomineeId: vote.nomineeId,
    nomineeName: vote.nomineeName || "",
    category: vote.category || "",
    units: Math.max(1, parseInt(vote.units, 10) || 1),
    amount: parseInt(vote.amount, 10) || 0,
    voter: vote.voter || "Anonymous",
    email: vote.email || "",
    phone: vote.phone || "",
    txId: txId || uid("TX"),
    status: "confirmed",
    at: vote.at || new Date().toISOString()
  });
  saveState(state);
  return true;
}

function recordConfirmedTicket(state, ticket) {
  if (!ticket) return null;
  if (!state.purchases) state.purchases = [];
  var txId = String(ticket.txId || "").trim();
  if (txId) {
    var existing = state.purchases.find(function (t) { return t.txId === txId; });
    if (existing) return existing;
  }
  var row = {
    id: ticket.id || uid("TKT"),
    tier: ticket.tier || "",
    price: Number(ticket.price) || 0,
    name: ticket.name || "Guest",
    email: ticket.email || "",
    phone: ticket.phone || "",
    txId: txId || uid("TX"),
    used: false,
    at: ticket.at || new Date().toISOString()
  };
  state.purchases.push(row);
  saveState(state);
  return row;
}

function startPayment(opts) {
  var state = opts.state;
  var amount = opts.amount;
  var customer = opts.customer || {};
  var meta = opts.meta;
  var description = opts.description;
  var onSuccess = opts.onSuccess;
  var onCancel = opts.onCancel;
  var anonymous = !!opts.anonymous;

  var naira = Math.round(Number(amount));
  if (!naira || naira < 1) {
    alert("Invalid amount.");
    if (onCancel) onCancel();
    return;
  }

  var tx_ref = uid("TX").replace(/[^a-zA-Z0-9\-]/g, "");

  if (anonymous) {
    customer = {
      name: "Anonymous Voter",
      email: "vote." + tx_ref.toLowerCase().replace(/[^a-z0-9]/g, "") + "@gmail.com",
      phone: "08000000000"
    };
  } else {
    if (!customer || !String(customer.name || "").trim()) {
      alert("Enter your full name.");
      if (onCancel) onCancel();
      return;
    }
    if (!isValidEmail(customer.email)) {
      alert("Enter a valid email (e.g. name@gmail.com).");
      if (onCancel) onCancel();
      return;
    }
  }

  var flatMeta = flattenMeta(meta);
  savePendingIntent({
    tx_ref: tx_ref,
    amount: naira,
    customer: {
      name: String(customer.name).trim(),
      email: String(customer.email).trim(),
      phone: sanitizePhone(customer.phone)
    },
    meta: flatMeta,
    description: description || "Payment",
    createdAt: new Date().toISOString()
  });

  var pending = {
    id: tx_ref,
    amount: naira,
    currency: "NGN",
    customer: customer,
    meta: flatMeta,
    description: description,
    status: "pending",
    createdAt: new Date().toISOString()
  };
  if (!state.transactions) state.transactions = [];
  state.transactions.push(pending);
  saveState(state);

  function finishSuccess(payment) {
    pending.status = "successful";
    pending.flw = payment || {};
    pending.confirmedAt = new Date().toISOString();
    if (payment && (payment.transaction_id || payment.id)) {
      pending.flwId = payment.transaction_id || payment.id;
    }
    saveState(state);
    clearPendingIntent();
    onSuccess(pending);
  }

  if (state.settings.demoPayments) {
    var ok = confirm(description + "\n\nAmount: " + money(naira) + "\n\nDemo is ON. OK = simulate payment.");
    if (ok) finishSuccess({ status: "successful", tx_ref: tx_ref, demo: true });
    else {
      clearPendingIntent();
      if (onCancel) onCancel();
    }
    return;
  }

  waitForFlutterwave(5000).then(function (ready) {
    if (!ready || !canUseLiveFlutterwave(state)) {
      clearPendingIntent();
      alert("Flutterwave could not start. Check internet and try again.");
      if (onCancel) onCancel();
      return;
    }
    try {
      FlutterwaveCheckout({
        public_key: getFlutterwaveKey(state),
        tx_ref: tx_ref,
        amount: naira,
        currency: "NGN",
        customer: {
          email: String(customer.email).trim(),
          phone_number: sanitizePhone(customer.phone),
          name: String(customer.name).trim()
        },
        meta: flatMeta,
        customizations: {
          title: "DECHEMATOS CLASS27",
          description: String(description || "Payment").slice(0, 100)
        },
        callback: function (payment) {
          // Reload state in case another tab wrote
          try { state = loadState(); } catch (e) {}
          // Re-find pending by tx_ref
          var p2 = (state.transactions || []).find(function (t) { return t.id === tx_ref; }) || pending;
          if (isFlutterwaveSuccess(payment)) {
            p2.status = "successful";
            p2.flw = payment || {};
            p2.confirmedAt = new Date().toISOString();
            saveState(state);
            clearPendingIntent();
            onSuccess(p2);
          } else {
            p2.status = (payment && payment.status) || "failed";
            saveState(state);
            clearPendingIntent();
            alert("Payment was not confirmed. Vote was not counted.");
            if (onCancel) onCancel();
          }
        },
        onclose: function () {
          if (pending.status === "pending" && onCancel) onCancel();
        }
      });
    } catch (err) {
      clearPendingIntent();
      alert("Could not open Flutterwave: " + (err && err.message ? err.message : String(err)));
      if (onCancel) onCancel();
    }
  });
}

function setBusy(el, on, label) {
  if (!el) return;
  if (on) {
    el.dataset.busyLabel = el.textContent;
    el.disabled = true;
    el.textContent = label || "Working…";
    el.style.opacity = "0.55";
    el.style.pointerEvents = "none";
  } else {
    el.disabled = false;
    el.textContent = el.dataset.busyLabel || el.textContent;
    el.style.opacity = "";
    el.style.pointerEvents = "";
  }
}

function busyClick(btn, fn) {
  if (!btn || btn.disabled) return;
  setBusy(btn, true);
  try {
    const result = fn();
    if (result && typeof result.then === "function") {
      result.finally(() => setBusy(btn, false));
    } else {
      setTimeout(() => setBusy(btn, false), 400);
    }
  } catch (e) {
    setBusy(btn, false);
    throw e;
  }
}

function clampUnits(v) {
  return Math.max(1, Math.min(Number(state.settings.maxVotesPerPurchase), Number(v) || 1));
}

function payForVotes() {
  const btn = $("payVotesBtn");
  if (btn && btn.disabled) return;
  if (!selectedNominee) return alert("Pick a contestant again.");
  const units = clampUnits($("voteUnits").value);
  const amount = Math.round(units * Number(state.settings.votePrice));
  if (amount < 1) return alert("Invalid vote amount.");
  const nomineeSnapshot = {
    id: selectedNominee.id,
    name: selectedNominee.name,
    category: selectedNominee.category
  };
  setBusy(btn, true, "Opening payment…");
  startPayment({
    state,
    amount,
    anonymous: true,
    customer: { name: "Anonymous Voter", email: "anon@gmail.com", phone: "08000000000" },
    description: units + " vote(s) for " + nomineeSnapshot.name,
    meta: {
      type: "vote",
      nomineeId: nomineeSnapshot.id,
      nomineeName: nomineeSnapshot.name,
      category: nomineeSnapshot.category,
      units: String(units)
    },
    onSuccess: (tx) => {
      // Reload latest state from storage then record
      try { state = loadState(); } catch (e) {}
      const added = recordConfirmedVote(state, {
        nomineeId: nomineeSnapshot.id,
        nomineeName: nomineeSnapshot.name,
        category: nomineeSnapshot.category,
        units,
        amount,
        voter: "Anonymous",
        email: "",
        phone: "",
        txId: tx.id
      });
      // Sync global state after record
      try { state = loadState(); } catch (e) {}
      closeModal();
      if (added) {
        alert("Payment confirmed. " + units + " vote(s) counted for " + nomineeSnapshot.name + ".");
      } else {
        alert("This payment was already counted.");
      }
      const idx = state.categories.indexOf(nomineeSnapshot.category);
      if (idx >= 0) setView("category", String(idx));
      else setView("vote");
    },
    onCancel: () => setBusy(btn, false)
  });
}

function payForTicket() {
  const btn = $("payTicketBtn");
  if (btn && btn.disabled) return;
  const customer = {
    name: $("buyName").value.trim(),
    email: $("buyEmail").value.trim(),
    phone: $("buyPhone").value.trim()
  };
  if (!customer.name) return alert("Enter your full name.");
  if (!customer.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(customer.email)) {
    return alert("Enter a valid email (e.g. name@gmail.com).");
  }
  const amount = Math.round(Number(selectedTicket.price));
  if (amount < 1) return alert("Ticket price is not set yet.");
  const tierSnapshot = { id: selectedTicket.id, name: selectedTicket.name, price: amount };
  setBusy(btn, true, "Opening payment…");
  startPayment({
    state,
    amount,
    customer,
    description: tierSnapshot.name + " entry ticket",
    meta: { type: "ticket", ticketId: tierSnapshot.id, tier: tierSnapshot.name },
    onSuccess: (tx) => {
      const ticket = recordConfirmedTicket(state, {
        tier: tierSnapshot.name,
        price: amount,
        name: customer.name,
        email: customer.email,
        phone: customer.phone,
        txId: tx.id
      });
      closeModal();
      if (ticket) {
        sessionStorage.setItem("lastTicket", ticket.id);
        setView("ticketview", ticket.id);

    },
    onCancel: () => setBusy(btn, false)
  });
}

function admitTicket() {
  if ($("scanPin").value !== state.settings.scanPin) {
    $("scanResult").textContent = "Wrong PIN.";
    return;
  }
  let raw = $("scanCode").value.trim();
  let id = raw;
  try {
    const parsed = JSON.parse(raw);
    if (parsed.id) id = parsed.id;
  } catch (_) {}
  const ticket = state.purchases.find(t => t.id === id);
  if (!ticket) {
    $("scanResult").textContent = "Ticket not found.";
    return;
  }
  if (ticket.used) {
    $("scanResult").textContent = `Already used — ${ticket.name} (${ticket.tier})`;
    return;
  }
  ticket.used = true;
  ticket.usedAt = new Date().toISOString();
  saveState(state);
  $("scanResult").textContent = `Welcome ${ticket.name} — ${ticket.tier}`;
}

function adminVotingHTML() {
  const s = state.settings;
  const toLocal = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const pad = n => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  };
  return `<div class="panel">
    <h3>Voting rules</h3>
    <label>Price per vote (₦)</label><input id="aVotePrice" type="number" value="${s.votePrice}" />
    <label>Minimum votes per purchase</label><input id="aMinVotes" type="number" value="${s.minVotesPerPurchase || 1}" />
    <label>Maximum votes per purchase</label><input id="aMaxVotes" type="number" value="${s.maxVotesPerPurchase || 5000}" />
    <label>Voting starts</label><input id="aVoteStart" type="datetime-local" value="${toLocal(s.voteStart)}" />
    <label>Voting ends</label><input id="aVoteEnd" type="datetime-local" value="${toLocal(s.voteEnd)}" />
    <button class="gold full" type="button" id="saveVotingBtn" style="margin-top:14px">Save voting rules</button>

}

function wireAdminSection() {
  const byId = (id) => $(id);
  if (byId("saveEventBtn")) byId("saveEventBtn").onclick = () => {
    setBusy(byId("saveEventBtn"), true);
    state.settings.title = byId("aTitle").value.trim() || state.settings.title;
    state.settings.subtitle = byId("aSubtitle").value.trim();
    state.settings.className = byId("aClass").value.trim();
    state.settings.department = byId("aDept").value.trim();
    state.settings.datetime = byId("aDate").value;
    state.settings.venue = byId("aVenue").value.trim();
    state.settings.tagline = byId("aTag").value.trim();
    state.settings.noRefunds = byId("aNoRefund").checked;
    saveState(state);
    setBusy(byId("saveEventBtn"), false);
    alert("Event saved.");
  };
  if (byId("saveContactsBtn")) byId("saveContactsBtn").onclick = () => {
    state.settings.whatsapp = byId("aWa").value.split(/\\n|,/).map(s => s.trim()).filter(Boolean);
    state.settings.tiktok = byId("aTt").value.replace(/^@/, "").trim();
    state.settings.committee = byId("aCommittee").value.split(",").map(s => s.trim()).filter(Boolean);
    saveState(state);
    setBusy(byId("saveContactsBtn"), false);
    alert("Contacts saved.");
  };
  if (byId("saveTicketsBtn")) byId("saveTicketsBtn").onclick = () => {
    setBusy(byId("saveTicketsBtn"), true);
    document.querySelectorAll("[data-tname]").forEach(el => {
      const i = +el.dataset.tname;
      if (state.tickets[i]) {
        state.tickets[i].name = el.value.trim() || state.tickets[i].name;
        const priceEl = document.querySelector(`[data-tprice="${i}"]`);
        const blurbEl = document.querySelector(`[data-tblurb="${i}"]`);
        if (priceEl) state.tickets[i].price = Number(priceEl.value) || 0;
        if (blurbEl) state.tickets[i].blurb = blurbEl.value.trim();
      }
    });
    saveState(state);
    setBusy(byId("saveTicketsBtn"), false);
    alert("Tickets saved.");
    paintAdmin();
  };
  if (byId("addTierBtn")) byId("addTierBtn").onclick = () => {
    const name = (byId("newTierName").value || "").trim();
    if (!name) return alert("Tier name required.");
    state.tickets.push({
      id: uid("t"),
      name,
      price: Number(byId("newTierPrice").value) || 0,
      blurb: (byId("newTierBlurb").value || "").trim()
    });
    saveState(state);
    paintAdmin();
  };
  document.querySelectorAll("[data-tdel]").forEach(btn => {
    btn.onclick = () => {
      const i = +btn.dataset.tdel;
      if (!confirm("Remove this ticket tier?")) return;
      state.tickets.splice(i, 1);
      saveState(state);
      paintAdmin();
    };
  });
  if (byId("saveVotingBtn")) byId("saveVotingBtn").onclick = () => {
    setBusy(byId("saveVotingBtn"), true);
    state.settings.votePrice = Number(byId("aVotePrice").value) || 100;
    state.settings.minVotesPerPurchase = Math.max(1, Number(byId("aMinVotes").value) || 1);
    state.settings.maxVotesPerPurchase = Math.max(1, Number(byId("aMaxVotes").value) || 5000);
    if (byId("aVoteStart").value) state.settings.voteStart = new Date(byId("aVoteStart").value).toISOString();
    if (byId("aVoteEnd").value) state.settings.voteEnd = new Date(byId("aVoteEnd").value).toISOString();
    saveState(state);
    setBusy(byId("saveVotingBtn"), false);
    alert("Voting rules saved.");
  };
  if (byId("addCatBtn")) byId("addCatBtn").onclick = () => {
    const name = (byId("newCat").value || "").trim();
    if (!name) return alert("Type a category name.");
    if (state.categories.includes(name)) return alert("Already exists.");
    state.categories.push(name);
    saveState(state);
    paintAdmin();
  };
  document.querySelectorAll("[data-cren]").forEach(btn => {
    btn.onclick = () => {
      const i = +btn.dataset.cren;
      const oldName = state.categories[i];
      const next = prompt("New category name", oldName);
      if (!next || !next.trim() || next.trim() === oldName) return;
      const name = next.trim();
      state.categories[i] = name;
      state.nominees.forEach(n => { if (n.category === oldName) n.category = name; });
      state.winners.forEach(w => { if (w.category === oldName) w.category = name; });
      saveState(state);
      paintAdmin();
    };
  });
  document.querySelectorAll("[data-cdel]").forEach(btn => {
    btn.onclick = () => {
      const i = +btn.dataset.cdel;
      const cat = state.categories[i];
      const count = state.nominees.filter(n => n.category === cat).length;
      if (count && !confirm(cat + " has " + count + " contestant(s). Delete category and those names?")) return;
      if (!count && !confirm("Delete category " + cat + "?")) return;
      state.categories.splice(i, 1);
      state.nominees = state.nominees.filter(n => n.category !== cat);
      saveState(state);
      paintAdmin();
    };
  });
  if (byId("quickAddBtn")) byId("quickAddBtn").onclick = () => {
    const name = (byId("quickName").value || "").trim();
    const cat = byId("quickCat").value;
    if (!name) return alert("Type a name.");
    state.nominees.push({ id: uid("n"), category: cat, name });
    saveState(state);
    paintAdmin();
  };
  document.querySelectorAll("[data-naddbtn]").forEach(btn => {
    btn.onclick = () => {
      const cat = btn.getAttribute("data-naddbtn");
      const input = document.querySelector(`[data-nadd="${CSS.escape(cat)}"]`);
      const name = (input && input.value || "").trim();
      if (!name) return alert("Type the contestant name.");
      state.nominees.push({ id: uid("n"), category: cat, name });
      saveState(state);
      paintAdmin();
    };
  });
  document.querySelectorAll("[data-nedit]").forEach(btn => {
    btn.onclick = () => {
      const person = state.nominees.find(n => n.id === btn.dataset.nedit);
      if (!person) return;
      const next = prompt("Correct the name", person.name);
      if (!next || !next.trim()) return;
      person.name = next.trim();
      saveState(state);
      paintAdmin();
    };
  });
  document.querySelectorAll("[data-nmove]").forEach(btn => {
    btn.onclick = () => {
      const person = state.nominees.find(n => n.id === btn.dataset.nmove);
      if (!person) return;
      const next = prompt("Move to which category?\\n\\n" + state.categories.join("\\n"), person.category);
      if (!next || !next.trim()) return;
      if (!state.categories.includes(next.trim())) return alert("Category not found. Type the exact name.");
      person.category = next.trim();
      saveState(state);
      paintAdmin();
    };
  });
  document.querySelectorAll("[data-ndel]").forEach(btn => {
    btn.onclick = () => {
      const person = state.nominees.find(n => n.id === btn.dataset.ndel);
      if (!person) return;
      if (!confirm("Remove " + person.name + "?")) return;
      state.nominees = state.nominees.filter(n => n.id !== person.id);
      saveState(state);
      paintAdmin();
    };
  });
  if (byId("saveProgBtn")) byId("saveProgBtn").onclick = () => {
    setBusy(byId("saveProgBtn"), true);
    document.querySelectorAll("[data-ptitle]").forEach(el => {
      const i = +el.dataset.ptitle;
      if (state.programme[i]) {
        state.programme[i].title = el.value.trim();
        const t = document.querySelector(`[data-ptime="${i}"]`);
        if (t) state.programme[i].time = t.value.trim();
      }
    });
    saveState(state);
    setBusy(byId("saveProgBtn"), false);
    alert("Programme saved.");
  };
  if (byId("addProgBtn")) byId("addProgBtn").onclick = () => {
    const title = (byId("newProgTitle").value || "").trim();
    if (!title) return alert("Title required.");
    state.programme.push({ title, time: (byId("newProgTime").value || "TBA").trim() });
    saveState(state);
    paintAdmin();
  };
  document.querySelectorAll("[data-pdel]").forEach(btn => {
    btn.onclick = () => {
      state.programme.splice(+btn.dataset.pdel, 1);
      saveState(state);
      paintAdmin();
    };
  });
  if (byId("addPhotoBtn")) byId("addPhotoBtn").onclick = () => {
    const url = (byId("photoUrl").value || "").trim();
    if (!url) return;
    state.gallery.push(url);
    saveState(state);
    paintAdmin();
  };
  document.querySelectorAll("[data-gdel]").forEach(btn => {
    btn.onclick = () => {
      state.gallery.splice(+btn.dataset.gdel, 1);
      saveState(state);
      paintAdmin();
    };
  });
  if (byId("addWinBtn")) byId("addWinBtn").onclick = () => {
    const name = (byId("winName").value || "").trim();
    if (!name) return;
    state.winners.push({ category: byId("winCat").value, name });
    saveState(state);
    paintAdmin();
  };
  document.querySelectorAll("[data-wdel]").forEach(btn => {
    btn.onclick = () => {
      state.winners.splice(+btn.dataset.wdel, 1);
      saveState(state);
      paintAdmin();
    };
  });
  if (byId("savePayBtn")) byId("savePayBtn").onclick = () => {
    const btn = byId("savePayBtn");
    setBusy(btn, true);
    state.settings.flutterwavePublicKey = byId("flwKey").value.trim();
    state.settings.demoPayments = byId("demoPay").checked;
    if (byId("adminPinSet").value) state.settings.adminPin = byId("adminPinSet").value;
    if (byId("scanPinSet").value) state.settings.scanPin = byId("scanPinSet").value;
    saveState(state);
    setBusy(btn, false);
    alert("Payments & PINs saved.");
  };
  if (byId("exportBtn")) byId("exportBtn").onclick = () => {
    byId("dataBox").value = JSON.stringify(state, null, 2);
    byId("dataBox").select();
    alert("Data in the box — copy it and keep it safe.");
  };
  if (byId("importBtn")) byId("importBtn").onclick = () => {
    try {
      const parsed = JSON.parse(byId("dataBox").value);
      if (!parsed.settings || !parsed.categories) throw new Error("Invalid");
      state = { ...structuredClone(DEFAULT_STATE), ...parsed, settings: { ...DEFAULT_STATE.settings, ...(parsed.settings || {}) } };
      saveState(state);
      alert("Imported.");
      paintAdmin();
    } catch {
      alert("Invalid JSON. Paste a full export.");
    }
  };
  if (byId("clearVotesBtn")) byId("clearVotesBtn").onclick = () => {
    if (!confirm("Clear all votes on this device?")) return;
    state.votes = [];
    saveState(state);
    paintAdmin();
  };
  if (byId("clearTicketsBtn")) byId("clearTicketsBtn").onclick = () => {
    if (!confirm("Clear all tickets on this device?")) return;
    state.purchases = [];
    saveState(state);
    paintAdmin();
  };
  if (byId("recoverVoteBtn")) byId("recoverVoteBtn").onclick = () => {
    const nomId = byId("recoverNom").value;
    const person = state.nominees.find(n => n.id === nomId);
    if (!person) return alert("Pick a contestant.");
    const units = Math.max(1, Number(byId("recoverUnits").value) || 1);
    const txId = (byId("recoverTx").value || "").trim() || ("MANUAL-" + Date.now());
    const added = recordConfirmedVote(state, {
      nomineeId: person.id,
      nomineeName: person.name,
      category: person.category,
      units,
      amount: units * Number(state.settings.votePrice || 100),
      voter: (byId("recoverVoter").value || "").trim() || "Recovered",
      email: "",
      txId
    });
    if (!added) return alert("That transaction was already recorded.");
    alert("Vote recovered and counted.");
    adminTab = "votes";
    paintAdmin();
  };
  if (byId("adminAdmitBtn")) byId("adminAdmitBtn").onclick = () => {
    let raw = (byId("adminScanCode").value || "").trim();
    let id = raw;
    try {
      const parsed = JSON.parse(raw);
      if (parsed.id) id = parsed.id;
    } catch (_) {}
    const ticket = state.purchases.find(t => t.id === id);
    const out = byId("adminScanResult");
    if (!ticket) {
      out.textContent = "Ticket not found on this device.";
      return;
    }
    if (ticket.used) {
      out.textContent = "Already used — " + ticket.name + " (" + ticket.tier + ")";
      return;
    }
    ticket.used = true;
    ticket.usedAt = new Date().toISOString();
    saveState(state);
    out.textContent = "Welcome " + ticket.name + " — " + ticket.tier;
  };
}

function escapeAttr(s) {
  return String(s || "").replaceAll("&", "&amp;").replaceAll('"', "&quot;").replaceAll("<", "&lt;");
}

function closeModal() {
  const o = $("overlay");
  if (o) { o.className = "overlay"; o.innerHTML = ""; }
}

function tick() {
  const v = state.settings.datetime;
  const d = $("d"), h = $("h"), m = $("m"), s = $("s");
  if (!d || !v) return;
  const x = new Date(v) - new Date();
  if (x < 0) return;
  d.textContent = Math.floor(x / 86400000);
  h.textContent = Math.floor(x / 3600000) % 24;
  m.textContent = Math.floor(x / 60000) % 60;
  s.textContent = Math.floor(x / 1000) % 60;
}

window.addEventListener("hashchange", route);
window.addEventListener("DOMContentLoaded", () => {
  layoutShell();
  route();
  setInterval(tick, 1000);
});

  </script>
